 <text x="54" y="210" fill="#f0f6fc" font-size="14">[REDACTED]</text><text x="250" y="210" fill="#8b949e" font-size="14">● CLASSIFIED</text>
 <line x1="560" y1="74" x2="560" y2="240" stroke="#17432e"/>
 <text x="600" y="106" fill="#8b949e" font-size="12">NEXT OBJECTIVE</text>
