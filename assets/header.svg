<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop stop-color="#0d1117"/>
    <stop offset=".5" stop-color="#07110d"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#163b2b" stroke-width="1" opacity=".3"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="360" rx="18" fill="url(#bg)"/>
<rect width="1200" height="360" rx="18" fill="url(#grid)"/>

<rect x="54" y="46" width="1092" height="268" rx="14" fill="#080c0a" stroke="#238636"/>
<path d="M54 84V60Q54 46 68 46H1132Q1146 46 1146 60V84Z" fill="#111814"/>
<circle cx="78" cy="65" r="5" fill="#ff5f56"/>
<circle cx="97" cy="65" r="5" fill="#ffbd2e"/>
<circle cx="116" cy="65" r="5" fill="#27c93f"/>
<text x="600" y="70" text-anchor="middle" fill="#8b949e" font-size="13" font-family="monospace">gawi@github: ~/profile</text>

<!-- moving scanline -->
<rect x="55" y="85" width="1090" height="18" fill="#55f991" opacity=".11">
  <animate attributeName="y" values="85;294;85" dur="5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;.16;0" dur="5s" repeatCount="indefinite"/>
</rect>

<!-- boot lines -->
<text x="86" y="116" fill="#8b949e" font-size="15" font-family="monospace" opacity="0">&gt; INITIALIZING PROFILE...
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.04;.08;1" dur="8s" repeatCount="indefinite"/>
</text>
<text x="86" y="144" fill="#8b949e" font-size="15" font-family="monospace" opacity="0">&gt; LOADING SECURITY / AI / SOFTWARE...
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.12;.17;1" dur="8s" repeatCount="indefinite"/>
</text>
<text x="86" y="172" fill="#55f991" font-size="15" font-family="monospace" opacity="0">&gt; SYSTEM ONLINE.
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.21;.27;1" dur="8s" repeatCount="indefinite"/>
</text>

<!-- brand glow pulse -->
<text x="84" y="235" fill="#55f991" font-size="68" font-weight="800" letter-spacing="6" font-family="monospace" filter="url(#glow)">
  GAWI01
  <animate attributeName="opacity" values=".78;1;.78" dur="3s" repeatCount="indefinite"/>
</text>

<!-- glitch ghost layers -->
<text x="84" y="235" fill="#58a6ff" font-size="68" font-weight="800" letter-spacing="6" font-family="monospace" opacity="0">GAWI01
  <animate attributeName="opacity" values="0;0;.55;0;0" keyTimes="0;.90;.92;.94;1" dur="5s" repeatCount="indefinite"/>
  <animate attributeName="x" values="84;84;78;90;84" keyTimes="0;.90;.92;.94;1" dur="5s" repeatCount="indefinite"/>
</text>
<text x="84" y="235" fill="#ff4da6" font-size="68" font-weight="800" letter-spacing="6" font-family="monospace" opacity="0">GAWI01
  <animate attributeName="opacity" values="0;0;.38;0;0" keyTimes="0;.94;.96;.98;1" dur="5s" repeatCount="indefinite"/>
  <animate attributeName="x" values="84;84;91;80;84" keyTimes="0;.94;.96;.98;1" dur="5s" repeatCount="indefinite"/>
</text>

<text x="89" y="270" fill="#f0f6fc" font-size="18" letter-spacing="3" font-family="monospace">SECURITY  //  AI  //  SOFTWARE</text>
<text x="89" y="298" fill="#8b949e" font-size="14" font-family="monospace">build // break // learn // repeat</text>

<!-- status card -->
<g transform="translate(840 112)">
  <rect width="250" height="135" rx="10" fill="#0d1117" stroke="#244c35"/>
  <text x="22" y="31" fill="#8b949e" font-size="12" font-family="monospace">STATUS</text>
  <circle cx="25" cy="59" r="6" fill="#55f991" filter="url(#glow)">
    <animate attributeName="opacity" values=".25;1;.25" dur="1.3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;7;5" dur="1.3s" repeatCount="indefinite"/>
  </circle>
  <text x="43" y="64" fill="#55f991" font-size="15" font-family="monospace">ONLINE</text>
  <text x="22" y="94" fill="#8b949e" font-size="12" font-family="monospace">CURRENTLY</text>
  <text x="22" y="119" fill="#f0f6fc" font-size="13" font-family="monospace">building something</text>
  <text x="198" y="119" fill="#55f991" font-size="16" font-family="monospace">.
    <animate attributeName="opacity" values=".1;1;.1" dur="1.2s" repeatCount="indefinite"/>
  </text>
  <text x="207" y="119" fill="#55f991" font-size="16" font-family="monospace">.
    <animate attributeName="opacity" values=".1;.1;1;.1" dur="1.2s" begin=".2s" repeatCount="indefinite"/>
  </text>
  <text x="216" y="119" fill="#55f991" font-size="16" font-family="monospace">.
    <animate attributeName="opacity" values=".1;.1;1;.1" dur="1.2s" begin=".4s" repeatCount="indefinite"/>
  </text>
</g>

<!-- blinking terminal cursor -->
<rect x="452" y="286" width="9" height="15" fill="#55f991">
  <animate attributeName="opacity" values="1;0;1" dur=".85s" repeatCount="indefinite"/>
</rect>

<text x="1110" y="296" text-anchor="end" fill="#55f991" font-size="13" font-family="monospace">GAWI01 // CONNECTED</text>
</svg>