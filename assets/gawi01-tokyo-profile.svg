<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1580" viewBox="0 0 1200 1580">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#08051c"/><stop offset=".58" stop-color="#170b35"/><stop offset="1" stop-color="#070913"/></linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff2bd6"/><stop offset="1" stop-color="#ff7a00"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00f5ff"/><stop offset=".48" stop-color="#ff2bd6"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#00f5ff" stroke-width="1" opacity=".10"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="sunClip"><circle cx="930" cy="200" r="105"/></clipPath>
</defs>

<rect width="1200" height="1580" rx="24" fill="url(#sky)"/>
<rect width="1200" height="1580" rx="24" fill="url(#grid)"><animateTransform attributeName="transform" type="translate" values="0 0;48 48;0 0" dur="16s" repeatCount="indefinite"/></rect>

<!-- HEADER / TOKYO -->
<circle cx="930" cy="200" r="105" fill="url(#sun)" opacity=".94" filter="url(#soft)"/>
<g clip-path="url(#sunClip)" stroke="#11092a" stroke-width="10" opacity=".78"><path d="M810 140H1050M810 170H1050M810 202H1050M810 237H1050M810 274H1050"/></g>
<g fill="#090b18" stroke="#34205e" stroke-width="2"><path d="M0 390V302h48v-58h62v91h48v-124h72v94h48v-48h62v93h52v-148h76v126h58v-71h54v96h60v-112h65v149z"/><path d="M700 390v-108h58v-65h50v111h50V166h66v143h58v-84h52v101h50V195h72v169h44v-95h50v121z"/></g>
