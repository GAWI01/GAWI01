<rect x="0" y="-18" width="1200" height="18" fill="#00f5ff" opacity=".055"><animate attributeName="y" values="-18;1580;-18" dur="8s" repeatCount="indefinite"/></rect>
<circle cy="1120" r="7" fill="#ff2bd6" filter="url(#glow)"><animate attributeName="cx" values="55;1145;55" dur="9s" repeatCount="indefinite"/></circle>
