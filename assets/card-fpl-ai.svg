<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-label="FPL-AI — Fantasy Premier League prediction and optimization">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0c18"/><stop offset="1" stop-color="#0d1a24"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00f5ff"/><stop offset="1" stop-color="#55ff9a"/></linearGradient>
  <clipPath id="c"><rect width="560" height="220" rx="16"/></clipPath>
</defs>
<g clip-path="url(#c)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="560" height="220" fill="url(#bg)"/>
  <rect width="560" height="4" fill="url(#edge)"/>
  <!-- sparkline: points over gameweeks -->
  <polyline points="330,170 360,150 390,158 420,128 450,136 480,104 510,112 540,78" fill="none" stroke="#00f5ff" stroke-width="2.5" stroke-linejoin="round" opacity=".35" stroke-dasharray="320" stroke-dashoffset="320">
    <animate attributeName="stroke-dashoffset" from="320" to="0" dur="2s" begin=".3s" fill="freeze"/>
  </polyline>
  <circle cx="540" cy="78" r="4" fill="#55ff9a" opacity="0"><set attributeName="opacity" to="1" begin="2.3s"/><animate attributeName="r" values="4;7;4" dur="1.6s" begin="2.3s" repeatCount="indefinite"/></circle>

  <text x="28" y="44" fill="#7d7a9c" font-size="13" letter-spacing="2">PUBLIC REPO</text>
  <text x="28" y="88" fill="#00f5ff" font-size="38" font-weight="900">FPL-AI</text>
  <text x="28" y="122" fill="#e8e6f2" font-size="16">Fantasy Premier League prediction</text>
  <text x="28" y="144" fill="#e8e6f2" font-size="16">+ squad optimization engine.</text>
  <g font-size="13" font-weight="700">
    <rect x="28" y="166" width="72" height="26" rx="13" fill="#0f2a33"/><text x="64" y="184" text-anchor="middle" fill="#00f5ff">Python</text>
    <rect x="108" y="166" width="78" height="26" rx="13" fill="#0f2a33"/><text x="147" y="184" text-anchor="middle" fill="#00f5ff">FastAPI</text>
    <rect x="194" y="166" width="42" height="26" rx="13" fill="#0f2a33"/><text x="215" y="184" text-anchor="middle" fill="#00f5ff">AI</text>
  </g>
  <circle cx="440" cy="40" r="5" fill="#55ff9a"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="532" y="45" text-anchor="end" fill="#55ff9a" font-size="13" font-weight="700" letter-spacing="1.5">ACTIVE</text>
</g>
<rect x=".5" y=".5" width="559" height="219" rx="16" fill="none" stroke="#1f3a48"/>
</svg>
