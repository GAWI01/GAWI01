<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="GAWI01 — Gabriel Witzøe — Cybersecurity, AI and Software">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#07060f"/><stop offset=".55" stop-color="#110a26"/><stop offset="1" stop-color="#05070d"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#00f5ff"/><stop offset=".5" stop-color="#ff2bd6"/><stop offset="1" stop-color="#ffd166"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#ffd166"/><stop offset=".5" stop-color="#ff2bd6"/><stop offset="1" stop-color="#7a1fff"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#05070d" stop-opacity="0"/><stop offset="1" stop-color="#05070d"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#00f5ff" stroke-width="1" opacity=".07"/>
  </pattern>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  <clipPath id="sunClip"><circle cx="520" cy="300" r="120"/></clipPath>
  <clipPath id="card"><rect width="1200" height="440" rx="20"/></clipPath>
  <!-- typing masks -->
  <clipPath id="t1"><rect x="0" y="-20" height="30" width="0"><animate attributeName="width" from="0" to="120" begin="0.4s" dur="0.6s" fill="freeze"/></rect></clipPath>
  <clipPath id="t2"><rect x="0" y="-20" height="30" width="0"><animate attributeName="width" from="0" to="160" begin="2.0s" dur="0.7s" fill="freeze"/></rect></clipPath>
  <clipPath id="t3"><rect x="0" y="-20" height="30" width="0"><animate attributeName="width" from="0" to="170" begin="4.2s" dur="0.6s" fill="freeze"/></rect></clipPath>
</defs>

<g clip-path="url(#card)">
  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" values="0 0;40 40" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="200" cy="120" r="160" fill="#00f5ff" opacity=".10" filter="url(#blur)"/>
  <circle cx="560" cy="330" r="200" fill="#ff2bd6" opacity=".12" filter="url(#blur)"/>

  <!-- synthwave sun -->
  <circle cx="520" cy="300" r="120" fill="url(#sun)" opacity=".85"/>
  <g clip-path="url(#sunClip)" fill="#0b0920">
    <rect x="390" y="300" width="260" height="5"/><rect x="390" y="320" width="260" height="8"/>
    <rect x="390" y="342" width="260" height="11"/><rect x="390" y="366" width="260" height="14"/>
    <rect x="390" y="392" width="260" height="18"/>
  </g>

  <!-- skyline -->
  <g fill="#070814" stroke="#2a1a52" stroke-width="1.5">
    <path d="M0 440V360h40v-40h46v60h30v-90h54v70h34v-36h48v66h40v-110h56v92h44v-52h40v70h46v-84h50v114h44v-60h38v40h50v-100h48v92h40v-58h46v76h52v-120h56v130h40v-70h46v70z"/>
  </g>
  <g opacity=".85">
    <rect x="132" y="300" width="6" height="12" fill="#00f5ff"/><rect x="146" y="318" width="6" height="12" fill="#ff2bd6"/>
    <rect x="300" y="282" width="6" height="12" fill="#00f5ff"/><rect x="314" y="300" width="6" height="12" fill="#ffd166"/>
    <rect x="460" y="300" width="6" height="12" fill="#ff2bd6"/><rect x="730" y="290" width="6" height="12" fill="#00f5ff"/>
    <rect x="970" y="266" width="6" height="12" fill="#ff2bd6"/><rect x="984" y="284" width="6" height="12" fill="#00f5ff"/>
    <rect x="1110" y="250" width="6" height="12" fill="#ffd166"/>
  </g>
  <rect y="300" width="1200" height="140" fill="url(#fade)"/>

  <!-- left: identity -->
  <text x="60" y="70" fill="#00f5ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" letter-spacing="3">東京 // NORWAY // EST. 01</text>
  <text x="56" y="168" fill="url(#neon)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="96" font-weight="900" letter-spacing="6" filter="url(#glow)">GAWI01</text>
  <text x="60" y="214" fill="#f5f7ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="30" font-weight="700" letter-spacing="4">GABRIEL WITZØE</text>
  <text x="60" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" letter-spacing="2">
    <tspan fill="#00f5ff">CYBERSECURITY</tspan><tspan fill="#5b5675"> / </tspan><tspan fill="#ff2bd6">AI</tspan><tspan fill="#5b5675"> / </tspan><tspan fill="#ffd166">SOFTWARE</tspan>
  </text>

  <!-- status pill -->
  <g transform="translate(60 284)">
    <rect width="190" height="34" rx="17" fill="#0c1a14" stroke="#55ff9a" stroke-opacity=".55"/>
    <circle cx="20" cy="17" r="5" fill="#55ff9a"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="34" y="23" fill="#55ff9a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" letter-spacing="1.5">ONLINE · BUILDING</text>
  </g>

  <!-- right: terminal -->
  <g transform="translate(690 52)">
    <rect width="450" height="300" rx="14" fill="#0a0c18" fill-opacity=".92" stroke="#2c2a4a"/>
    <rect width="450" height="300" rx="14" fill="none" stroke="url(#neon)" stroke-opacity=".5"/>
    <path d="M0 14a14 14 0 0 1 14-14h422a14 14 0 0 1 14 14v22H0z" fill="#12142a"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
    <text x="225" y="23" text-anchor="middle" fill="#7d7a9c" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">gabriel@gawi01: ~</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">
      <g transform="translate(22 70)">
        <text fill="#ff2bd6">❯</text>
        <g transform="translate(20 0)"><text clip-path="url(#t1)" fill="#f5f7ff">whoami</text></g>
      </g>
      <text x="22" y="96" fill="#c9c6de" opacity="0">gabriel — security · ai · software<set attributeName="opacity" to="1" begin="1.3s"/></text>

      <g transform="translate(22 134)" opacity="0"><set attributeName="opacity" to="1" begin="1.7s"/>
        <text fill="#ff2bd6">❯</text>
        <g transform="translate(20 0)"><text clip-path="url(#t2)" fill="#f5f7ff">cat focus.txt</text></g>
      </g>
      <g opacity="0"><set attributeName="opacity" to="1" begin="2.9s"/>
        <text x="22" y="160" fill="#00f5ff">→ <tspan fill="#c9c6de">security engineering</tspan></text>
      </g>
      <g opacity="0"><set attributeName="opacity" to="1" begin="3.2s"/>
        <text x="22" y="184" fill="#ff2bd6">→ <tspan fill="#c9c6de">ai systems</tspan></text>
      </g>
      <g opacity="0"><set attributeName="opacity" to="1" begin="3.5s"/>
        <text x="22" y="208" fill="#ffd166">→ <tspan fill="#c9c6de">shipping real products</tspan></text>
      </g>

      <g transform="translate(22 246)" opacity="0"><set attributeName="opacity" to="1" begin="3.9s"/>
        <text fill="#ff2bd6">❯</text>
        <g transform="translate(20 0)"><text clip-path="url(#t3)" fill="#f5f7ff">./ship --secure</text></g>
      </g>
      <g opacity="0"><set attributeName="opacity" to="1" begin="5.1s"/>
        <text x="22" y="272" fill="#55ff9a">✔ <tspan fill="#c9c6de">deployed. next one loading</tspan></text>
        <rect x="298" y="258" width="10" height="18" fill="#00f5ff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
      </g>
    </g>
  </g>

  <!-- scanline -->
  <rect y="-12" width="1200" height="12" fill="#00f5ff" opacity=".05">
    <animate attributeName="y" values="-12;440" dur="5s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x=".5" y=".5" width="1199" height="439" rx="20" fill="none" stroke="#2c2a4a"/>
</svg>
