<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="GAWI01 — Gabriel Witzøe — Cybersecurity, AI and Software">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#07060f"/><stop offset=".55" stop-color="#110a26"/><stop offset="1" stop-color="#05070d"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#00f5ff"/><stop offset=".5" stop-color="#ff2bd6"/><stop offset="1" stop-color="#ffd166"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#ffd166"/><stop offset=".5" stop-color="#ff2bd6"/><stop offset="1" stop-color="#7a1fff"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#05070d" stop-opacity="0"/><stop offset="1" stop-color="#05070d"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#00f5ff" stroke-width="1" opacity=".07"/>
  </pattern>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  <clipPath id="sunClip"><circle cx="910" cy="215" r="125"/></clipPath>
  <clipPath id="card"><rect width="1200" height="340" rx="20"/></clipPath>
</defs>

<g clip-path="url(#card)">
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" values="0 0;40 40" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="200" cy="110" r="160" fill="#00f5ff" opacity=".10" filter="url(#blur)"/>
  <circle cx="910" cy="230" r="220" fill="#ff2bd6" opacity=".14" filter="url(#blur)"/>

  <!-- synthwave sun -->
  <circle cx="910" cy="215" r="125" fill="url(#sun)" opacity=".9"/>
  <g clip-path="url(#sunClip)" fill="#0b0920">
    <rect x="780" y="215" width="260" height="5"/><rect x="780" y="235" width="260" height="8"/>
    <rect x="780" y="257" width="260" height="11"/><rect x="780" y="281" width="260" height="14"/>
    <rect x="780" y="307" width="260" height="18"/>
  </g>

  <!-- skyline -->
  <g fill="#070814" stroke="#2a1a52" stroke-width="1.5">
    <path d="M560 340v-70h40v-40h46v60h30v-90h54v70h34v-36h48v66h40v-110h56v92h44v-52h40v70h46v-84h50v114h44v-60h38v40h50v-100h48v92h40v76z"/>
  </g>
  <g opacity=".85">
    <rect x="700" y="230" width="6" height="12" fill="#00f5ff"/><rect x="714" y="248" width="6" height="12" fill="#ff2bd6"/>
    <rect x="860" y="200" width="6" height="12" fill="#00f5ff"/><rect x="874" y="218" width="6" height="12" fill="#ffd166"/>
    <rect x="1020" y="246" width="6" height="12" fill="#ff2bd6"/><rect x="1130" y="190" width="6" height="12" fill="#00f5ff"/>
  </g>
  <rect y="240" width="1200" height="100" fill="url(#fade)"/>

  <!-- identity -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="60" y="68" fill="#00f5ff" font-size="17" font-weight="700" letter-spacing="3">東京 // NORWAY</text>
    <text x="56" y="160" fill="url(#neon)" font-size="92" font-weight="900" letter-spacing="6" filter="url(#glow)">GAWI01</text>
    <text x="60" y="206" fill="#f5f7ff" font-size="30" font-weight="700" letter-spacing="4">GABRIEL WITZØE</text>
    <text x="60" y="248" font-size="20" font-weight="700" letter-spacing="2">
      <tspan fill="#00f5ff">CYBERSECURITY</tspan><tspan fill="#5b5675"> / </tspan><tspan fill="#ff2bd6">AI</tspan><tspan fill="#5b5675"> / </tspan><tspan fill="#ffd166">SOFTWARE</tspan>
    </text>
    <g transform="translate(60 274)">
      <rect width="190" height="34" rx="17" fill="#0c1a14" stroke="#55ff9a" stroke-opacity=".55"/>
      <circle cx="20" cy="17" r="5" fill="#55ff9a"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="34" y="23" fill="#55ff9a" font-size="15" font-weight="700" letter-spacing="1.5">ONLINE · BUILDING</text>
    </g>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="339" rx="20" fill="none" stroke="#2c2a4a"/>
</svg>
