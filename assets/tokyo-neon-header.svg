<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#08051c"/><stop offset=".55" stop-color="#170b35"/><stop offset="1" stop-color="#070913"/></linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff2bd6"/><stop offset="1" stop-color="#ff7a00"/></linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00f5ff"/><stop offset=".48" stop-color="#ff2bd6"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#00f5ff" stroke-width=".7" opacity=".13"/></pattern>
  <filter id="cyanGlow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="pinkGlow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="sunClip"><circle cx="930" cy="176" r="95"/></clipPath>
</defs>
<rect width="1200" height="430" rx="22" fill="url(#sky)"/>
<rect width="1200" height="430" rx="22" fill="url(#grid)"><animateTransform attributeName="transform" type="translate" values="0 0;38 38;0 0" dur="14s" repeatCount="indefinite"/></rect>
<!-- neon sun -->
<circle cx="930" cy="176" r="95" fill="url(#sun)" opacity=".9" filter="url(#pinkGlow)"/>
<g clip-path="url(#sunClip)" stroke="#11092a" stroke-width="8" opacity=".75"><path d="M820 125H1040M820 148H1040M820 174H1040M820 203H1040M820 235H1040"/></g>
<!-- distant city -->
<g fill="#090b18" stroke="#34205e" stroke-width="1">
 <path d="M0 328V266h44v-46h52v74h45v-105h66v80h43v-40h53v77h47v-128h68v106h51v-60h46v79h53v-92h57v118h55v-67h51v111z"/>
 <path d="M705 328v-89h52v-54h43v92h44v-133h58v117h50v-69h45v83h43v-108h64v141h46v-79h50v99z"/>
</g>
<!-- windows -->
<g fill="#00f5ff" opacity=".7"><rect x="160" y="211" width="7" height="14"/><rect x="183" y="211" width="7" height="14"/><rect x="326" y="208" width="8" height="15"/><rect x="356" y="208" width="8" height="15"/><rect x="744" y="258" width="8" height="14"/><rect x="780" y="214" width="8" height="14"/><rect x="1025" y="195" width="8" height="14"/></g>
<g fill="#ff2bd6" opacity=".75"><rect x="63" y="241" width="8" height="15"/><rect x="218" y="284" width="8" height="14"/><rect x="393" y="205" width="8" height="15"/><rect x="856" y="170" width="8" height="15"/><rect x="1080" y="191" width="8" height="15"/></g>
<!-- torii silhouette -->
<g fill="#050710"><rect x="1030" y="249" width="13" height="79"/><rect x="1120" y="249" width="13" height="79"/><rect x="1005" y="240" width="154" height="10" rx="4"/><rect x="1018" y="256" width="128" height="8"/></g>
<!-- foreground -->
<rect x="0" y="328" width="1200" height="102" fill="#05070d"/>
<path d="M0 397L600 333L1200 397" fill="none" stroke="#ff2bd6" stroke-width="2" opacity=".35"/>
<path d="M0 416L600 343L1200 416" fill="none" stroke="#00f5ff" stroke-width="2" opacity=".28"/>
<!-- header -->
<text x="52" y="57" fill="#00f5ff" font-family="monospace" font-size="16" filter="url(#cyanGlow)">東京 // GAWI01 // NODE_01</text>
<text x="1148" y="57" text-anchor="end" fill="#ff4fd8" font-family="monospace" font-size="14">ONLINE ●</text>
<line x1="52" y1="77" x2="1148" y2="77" stroke="url(#title)" opacity=".6"/>
<text x="55" y="160" fill="url(#title)" font-family="monospace" font-size="82" font-weight="800" letter-spacing="8" filter="url(#cyanGlow)">GAWI01</text>
<text x="60" y="202" fill="#f5f7ff" font-family="monospace" font-size="24" letter-spacing="5">GABRIEL WITZØE</text>
<text x="60" y="237" fill="#00f5ff" font-family="monospace" font-size="18" letter-spacing="3">CYBERSECURITY</text>
<text x="245" y="237" fill="#ff2bd6" font-family="monospace" font-size="18" letter-spacing="3">// AI</text>
<text x="325" y="237" fill="#ffd166" font-family="monospace" font-size="18" letter-spacing="3">// SOFTWARE</text>
<text x="60" y="283" fill="#b9b5d0" font-family="monospace" font-size="16">&gt; building things after dark...</text>
<rect x="60" y="302" width="11" height="19" fill="#00f5ff"><animate attributeName="opacity" values="1;.1;1" dur="1s" repeatCount="indefinite"/></rect>
<!-- scanline -->
<rect x="0" y="-12" width="1200" height="12" fill="#00f5ff" opacity=".06"><animate attributeName="y" values="-12;430;-12" dur="6s" repeatCount="indefinite"/></rect>
</svg>
