  <text x="420" y="101">[ Python ]</text><text x="545" y="101">[ TypeScript ]</text><text x="705" y="101">[ Next.js ]</text><text x="825" y="101">[ FastAPI ]</text><text x="950" y="101">[ Docker ]</text>
  <text x="420" y="148">[ Supabase ]</text><text x="560" y="148">[ Git ]</text><text x="655" y="148">[ SQL ]</text><text x="750" y="148">[ Linux ]</text>
 </g>
