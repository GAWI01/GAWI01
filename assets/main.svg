 <text x="40" y="343" fill="#55f991" font-size="14">NORWAY</text>
 <text x="40" y="407" fill="#8b949e" font-size="12">STATUS</text>
 <circle cx="46" cy="440" r="6" fill="#55f991"><animate attributeName="opacity" values=".25;1;.25" dur="1.3s" repeatCount="indefinite"/></circle>
 <text x="63" y="445" fill="#55f991" font-size="14">ALWAYS BUILDING</text>

 <text x="415" y="54" fill="#55f991" font-size="18">// TECH STACK</text>
